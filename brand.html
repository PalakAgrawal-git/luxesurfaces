<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#cfc5b4">
  <title>Brands | Luxe Surfaces</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&family=Wix+Madefor+Display:wght@400;500&family=Wix+Madefor+Text:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=106">
</head>
<body class="page-light">

<main id="brand"></main>

<script src="js/brands-data.js?v=106"></script>
<script>
  const IMG = "https://static.wixstatic.com/media/";
  const slug = new URLSearchParams(location.search).get("b");
  const i = Math.max(0, BRANDS.findIndex((b) => b.slug === slug));
  const b = BRANDS[i];
  const next = BRANDS[(i + 1) % BRANDS.length];
  const prev = BRANDS[(i - 1 + BRANDS.length) % BRANDS.length];
  document.title = `${b.name} | Luxe Surfaces`;

  document.getElementById("brand").innerHTML = `
    <section class="page-hero brand-hero">
      <div class="wrap">
        <a class="back" href="brands.html">← All brands</a>
        ${b.logo ? `<img class="brand-logo" src="${b.logo}?v=106" alt="${b.name} logo">` : ""}
        <h1>${b.name}</h1>
        <p>${b.intro}</p>
      </div>
    </section>

    <section class="brand-gallery">
      <div class="wrap gallery">
        ${b.images.map((f, n) => `<figure><img src="${f.startsWith("assets/") ? f : IMG + f}" alt="${b.name} surface ${n + 1}"></figure>`).join("")}
      </div>
    </section>

    <section>
      <div class="wrap brand-body reveal">
        <span class="eyebrow">About ${b.name}</span>
        ${b.subhead ? `<h2>${b.subhead}</h2>` : ""}
        ${b.body.map((p) => `<p>${p}</p>`).join("")}
        <a class="btn" href="contact.html">Consultation</a>
      </div>
    </section>

    <nav class="brand-nav wrap">
      <a href="brand.html?b=${prev.slug}"><small>Previous</small>${prev.name}</a>
      <a href="brand.html?b=${next.slug}" style="text-align:right"><small>Next</small>${next.name}</a>
    </nav>`;
</script>
<script src="js/main.js?v=106"></script>
</body>
</html>
