<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#efede9">
  <title>Contact Us | Luxe Surfaces</title>
  <meta name="description" content="Send us a Message">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="page-light">

<section class="page-hero" style="padding-bottom:40px">
  <div class="wrap reveal">
    <span class="eyebrow">Luxe Surfaces</span>
    <h1>Contact us</h1>
  </div>
</section>

<section class="split" style="border-top:1px solid var(--line)">
  <div class="copy reveal">
    <h2>Send us a Message</h2>
    <form id="contact-form">
      <label>First name*<input name="first" required autocomplete="given-name"></label>
      <label>Last name*<input name="last" required autocomplete="family-name"></label>
      <label class="full">Email*<input name="email" type="email" required autocomplete="email"></label>
      <label class="full">Message<textarea name="message"></textarea></label>
      <button class="btn" type="submit">Submit</button>
    </form>
  </div>
  <div class="copy olive reveal">
    <span class="eyebrow">Visit</span>
    <h3>LUXE SURFACES LLP</h3>
    <p style="margin-top:1rem">First Floor, Haji Moosa Patrawala Ind. Estate, Kishav Ravkhadhi Rd 20,<br>Dr E Moses Road, Kishav Ravkhadhi Rd, opposite VFS,<br>Mahalakshmi,<br>Mumbai, Maharashtra 400011</p>
    <p><a href="tel:+918657030761">+91 86570 30761</a><br><a href="mailto:info@luxesurfaces.in">info@luxesurfaces.in</a></p>
  </div>
</section>

<iframe title="Map" src="https://www.google.com/maps?q=Haji+Moosa+Patrawala+Industrial+Estate+Mahalakshmi+Mumbai&output=embed" style="width:100%;height:420px;border:0;display:block;filter:grayscale(.15)" loading="lazy"></iframe>
