<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#efede9">
  <title>Projects | Luxe Surfaces</title>
  <meta name="description" content="Discover transformative design solutions that elevate spaces through precision and artistry">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&family=Wix+Madefor+Display:wght@400;500&family=Wix+Madefor+Text:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=67">
</head>
<body>

<section class="hero" style="height:70svh">
  <img src="https://static.wixstatic.com/media/027a73_6c77c086cca2456593bd990a32486e71~mv2.jpg" alt="">
  <div class="hero-inner">
    <span class="eyebrow">Luxe Surfaces</span>
    <h1>Projects</h1>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="section-head reveal">
      <h2>Project Gallery</h2>
      <p>Discover transformative design solutions that elevate spaces through precision and artistry</p>
    </div>
    <div class="grid g3 swipe reveal" id="project-grid" style="border:0;gap:16px"></div>
  </div>
</section>

<section class="clients">
  <div class="wrap" style="text-align:center;margin-bottom:40px"><span class="eyebrow">Our Clients</span></div>
  <div data-clients></div>
</section>

<script src="js/projects-data.js?v=67"></script>
<script>
  document.getElementById("project-grid").innerHTML = PROJECTS.map((p) => `
    <a class="img-card${p.coverIsLogo ? " logo-card" : ""}" href="project.html?p=${p.slug}"${p.images.length > 1 ? ` data-slides="${p.images.slice(1).join(",")}"` : ""}>
      <img src="${p.cover}" alt="${p.title}" loading="lazy">
      <div class="label"><h3>${p.title}</h3><small>${p.place} · View project</small></div>
    </a>`).join("");
</script>
<script src="js/main.js?v=67"></script>
</body>
</html>
